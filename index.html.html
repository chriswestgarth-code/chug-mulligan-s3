    // IMAGE COMPRESSION HELPER (CLIENT-SIDE CANVAS FOR FIRESTORE SYNC)

    function compressImageFile(file, maxDimension = 260, quality = 0.8) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith("image/")) {
          reject(new Error("Please choose a valid image file."));
          return;
        }
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxDimension) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              }
            } else {
              if (height > maxDimension) {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL("image/jpeg", quality);
            resolve(dataUrl);
          };
          img.onerror = () => reject(new Error("Could not load image."));
          img.src = event.target.result;
        };
        reader.onerror = () => reject(new Error("Could not read file."));
        reader.readAsDataURL(file);
      });
    }

    // =========================================================================
    // AVATAR COMPONENT (SUPPORTS STATIC PHOTOS, GIF FALLBACKS & OPTIONAL UPLOAD)
    // =========================================================================

    function PhotoDropAvatar({
      photoUrl,
      fallbackPhotoUrl,
      fallbackText,
      bgColor,
      textColor,
      sizeClass = "w-12 h-12",
      onUpload,
      hint = "Update photo"
    }) {
      const [dragging, setDragging] = useState(false);
      const [imgFailed, setImgFailed] = useState(false);
      const [fallbackFailed, setFallbackFailed] = useState(false);
      const inputRef = useRef(null);

      useEffect(() => {
        setImgFailed(false);
        setFallbackFailed(false);
      }, [photoUrl, fallbackPhotoUrl]);

      const handleFiles = async (files) => {
        if (!files || !files[0] || !onUpload) return;
        try {
          await onUpload(files[0]);
        } catch (err) {
          console.error(err);
        }
      };

      const onDrop = (e) => {
        if (!onUpload) return;
        e.preventDefault();
        e.stopPropagation();
        setDragging(false);
        handleFiles(e.dataTransfer.files);
      };

      const activeSrc = !imgFailed && photoUrl
        ? photoUrl
        : !fallbackFailed && fallbackPhotoUrl
        ? fallbackPhotoUrl
        : null;

      return (
        <div
          onDragOver={(e) => {
            if (!onUpload) return;
            e.preventDefault();
            e.stopPropagation();
            setDragging(true);
          }}
          onDragLeave={(e) => {
            if (!onUpload) return;
            e.preventDefault();
            e.stopPropagation();
            setDragging(false);
          }}
          onDrop={onDrop}
          onClick={(e) => {
            if (!onUpload) return;
            e.stopPropagation();
            if (inputRef.current) inputRef.current.click();
          }}
          title={onUpload ? hint : undefined}
          className={`relative ${sizeClass} rounded-full border-2 border-[#1A2B3C] overflow-hidden flex items-center justify-center select-none group transition-transform ${
            onUpload ? "cursor-pointer" : ""
          } ${dragging ? "scale-105 ring-4 ring-[#D49B35]" : onUpload ? "hover:scale-105" : ""}`}
          style={{ backgroundColor: bgColor, color: textColor }}
        >
          {activeSrc ? (
            <img
              src={activeSrc}
              alt={fallbackText}
              onError={() => {
                if (!imgFailed && photoUrl) setImgFailed(true);
                else setFallbackFailed(true);
              }}
              className="w-full h-full object-cover"
            />
          ) : (
            <span className="font-display text-sm sm:text-base">{fallbackText}</span>
          )}

          {onUpload && (
            <div
              className={`absolute inset-0 bg-[#1A2B3C]/70 text-[#FAF8F3] flex items-center justify-center text-[10px] font-mono-swiss font-bold uppercase text-center px-1 transition-opacity ${
                dragging ? "opacity-100" : "opacity-0 group-hover:opacity-100"
              }`}
            >
              {dragging ? "DROP!" : "UPDATE"}
            </div>
          )}

          {onUpload && (
            <input
              ref={inputRef}
              type="file"
              accept="image/*"
              className="hidden"
              onChange={(e) => {
                handleFiles(e.target.files);
                e.target.value = "";
              }}
            />
          )}
        </div>
      );
    }

    // =========================================================================
    // HEAD-TO-HEAD SCORING ENGINE (2 PTS WIN | 1 PT LOSER IF BEATING HANDICAP)
    // =========================================================================

    function calculateMatchOutcome({
      playerA,
      hcpA,
      grossA,
      playerB,
      hcpB,
      grossB,
      par,
      tiebreaker
    }) {
      const gA = Number(grossA);
      const hA = Number(hcpA);
      const gB = Number(grossB);
      const hB = Number(hcpB);
      const coursePar = Number(par) || 72;

      const netA = gA - hA;
      const netB = gB - hB;
      const beatHcpA = netA < coursePar;
      const beatHcpB = netB < coursePar;

      let ptsA = 0;
      let ptsB = 0;
      let resultA = "T";
      let resultB = "T";
      let winner = null;
      let loserBonusA = false;
      let loserBonusB = false;
      const margin = Math.abs(netA - netB);

      if (netA < netB) {
        ptsA = 2;
        resultA = "W";
        resultB = "L";
        winner = playerA;
        if (beatHcpB) {
          ptsB = 1;
          loserBonusB = true;
        }
      } else if (netB < netA) {
        ptsB = 2;
        resultB = "W";
        resultA = "L";
        winner = playerB;
        if (beatHcpA) {
          ptsA = 1;
          loserBonusA = true;
        }
      } else {
        if (tiebreaker === "A") {
          ptsA = 2;
          resultA = "W";
          resultB = "L";
          winner = playerA;
          if (beatHcpB) {
            ptsB = 1;
            loserBonusB = true;
          }
        } else if (tiebreaker === "B") {
          ptsB = 2;
          resultB = "W";
          resultA = "L";
          winner = playerB;
          if (beatHcpA) {
            ptsA = 1;
            loserBonusA = true;
          }
        } else {
          ptsA = 1;
          ptsB = 1;
          resultA = "T";
          resultB = "T";
          winner = "TIE";
        }
      }

      return {
        netA,
        beatHcpA,
        loserBonusA,
        ptsA,
        resultA,
        netB,
        beatHcpB,
        loserBonusB,
        ptsB,
        resultB,
        winner,
        margin
      };
    }

      };

      // Subscribe to Firebase Firestore collections
      useEffect(() => {
        const unsubs = [];

        const connectFirestore = () => {
          if (!window.FirebaseDB) return;
          const { db, collection, doc, onSnapshot } = window.FirebaseDB;

          try {
            const unsubMatches = onSnapshot(
              collection(db, "season3_matches"),
              (snapshot) => {
                const loaded = snapshot.docs.map((d) => ({
                  id: d.id,
                  ...d.data()
                }));
                loaded.sort((a, b) => (a.createdAtMs || 0) - (b.createdAtMs || 0));
                setMatches(loaded);
                setDbStatus("live");
              },
              (err) => {
                console.warn("Firestore matches error:", err);
                setMatches(JSON.parse(localStorage.getItem("cm_s3_matches") || "[]"));
                setDbStatus("local");
              }
            );
            unsubs.push(unsubMatches);

            const unsubPlayers = onSnapshot(
              collection(db, "season3_players"),
              (snapshot) => {
                const photoMap = {};
                const bioMap = {};
                snapshot.docs.forEach((d) => {
                  const data = d.data();
                  if (data.photoUrl) photoMap[d.id] = data.photoUrl;
                  if (data.bio !== undefined) bioMap[d.id] = data.bio;
                });
                setPlayerPhotos(photoMap);
                setPlayerBios(bioMap);
              },
              () => {
                setPlayerPhotos(JSON.parse(localStorage.getItem("cm_s3_player_photos") || "{}"));
                setPlayerBios(JSON.parse(localStorage.getItem("cm_s3_player_bios") || "{}"));
              }
            );
            unsubs.push(unsubPlayers);

            const unsubHof = onSnapshot(
              collection(db, "season3_hof"),
              (snapshot) => {
                const map = {};
                snapshot.docs.forEach((d) => {
                  if (d.data().photoUrl) map[d.id] = d.data().photoUrl;
                });
                setHofPhotos(map);
              },
              () => {
                setHofPhotos(JSON.parse(localStorage.getItem("cm_s3_hof_photos") || "{}"));
              }
            );
            unsubs.push(unsubHof);

            const unsubFixtures = onSnapshot(
              collection(db, "season3_fixtures"),
              (snapshot) => {
                if (!snapshot.empty) {
                  const loadedFix = snapshot.docs.map((d) => ({
                    id: d.id,
                    ...d.data()
                  }));
                  loadedFix.sort((a, b) => (a.order || 50) - (b.order || 50));
                  setFixtures(loadedFix);
                }
              },
              () => {
                const cached = localStorage.getItem("cm_s3_fixtures");
                if (cached) setFixtures(JSON.parse(cached));
              }
            );
            unsubs.push(unsubFixtures);

            const unsubPoster = onSnapshot(
              doc(db, "season3_settings", "poster"),
              (snap) => {
                if (snap.exists() && snap.data().imageUrl) {
                  setPosterImage(snap.data().imageUrl);
                } else {
                  setPosterImage(null);
                }
              },
              () => {
                const cachedPoster = localStorage.getItem("cm_s3_poster");
                if (cachedPoster) setPosterImage(cachedPoster);
              }
            );
            unsubs.push(unsubPoster);
          } catch (e) {
            console.warn("Firestore setup failed:", e);
            setDbStatus("local");
          }
        };

        if (window.FirebaseDB) {
          connectFirestore();
        } else {
          window.addEventListener("firebase-ready", connectFirestore);
        }

        return () => {
          window.removeEventListener("firebase-ready", connectFirestore);
          unsubs.forEach((fn) => fn && fn());
        };
      }, []);

          }
          showToast(`${playerId}'s profile bio saved!`);
        } catch (err) {
          showToast("Could not save bio.", "error");
        }
      };

      const handleUploadHofPhoto = async (hofId, file) => {
        try {
          const dataUrl = await compressImageFile(file, 280, 0.82);
          const updated = { ...hofPhotos, [hofId]: dataUrl };
          setHofPhotos(updated);
          localStorage.setItem("cm_s3_hof_photos", JSON.stringify(updated));

          if (dbStatus === "live" && window.FirebaseDB) {
            const { db, doc, setDoc } = window.FirebaseDB;
            await setDoc(
              doc(db, "season3_hof", hofId),
              { photoUrl: dataUrl, updatedAtMs: Date.now() },
              { merge: true }
            );
          }
          showToast("Hall of Fame champion photo saved!");
        } catch (err) {
          showToast(err.message || "Could not upload photo.", "error");
        }
      };

      const handleUploadPoster = async (file) => {
        try {
          const dataUrl = await compressImageFile(file, 1080, 0.82);
          setPosterImage(dataUrl);
          localStorage.setItem("cm_s3_poster", dataUrl);

          if (dbStatus === "live" && window.FirebaseDB) {
            const { db, doc, setDoc } = window.FirebaseDB;
            await setDoc(
              doc(db, "season3_settings", "poster"),
              { imageUrl: dataUrl, updatedAtMs: Date.now() },
              { merge: true }
            );
          }
          showToast("Season 3 fixture poster uploaded!");
        } catch (err) {
          showToast(err.message || "Could not upload poster.", "error");
        }
      };

      const handleClearPoster = async () => {
        setPosterImage(null);
        localStorage.removeItem("cm_s3_poster");
        if (dbStatus === "live" && window.FirebaseDB) {
          const { db, doc, deleteDoc } = window.FirebaseDB;
          await deleteDoc(doc(db, "season3_settings", "poster"));
        }
        showToast("Poster removed.");
      };

      // Sync Official 7-Player / 7-Week Schedule to Firestore
      const handleSyncOfficialSchedule = async () => {
        try {
          setFixtures(DEFAULT_FIXTURES);
          localStorage.setItem("cm_s3_fixtures", JSON.stringify(DEFAULT_FIXTURES));
          if (dbStatus === "live" && window.FirebaseDB) {
            const { db, doc, setDoc, deleteDoc } = window.FirebaseDB;
            const officialIds = new Set(DEFAULT_FIXTURES.map((f) => f.id));
            for (const old of fixtures) {
              if (!officialIds.has(old.id)) {
                await deleteDoc(doc(db, "season3_fixtures", old.id));
              }
            }
            for (const item of DEFAULT_FIXTURES) {
              await setDoc(doc(db, "season3_fixtures", item.id), item);
            }
          }
          showToast("Official 7-player schedule synced!");
        } catch (err) {
          console.error(err);
          showToast("Could not sync schedule.", "error");
        }
      };

      const handleSaveFixture = async (e) => {
        e.preventDefault();
        if (!editingFixture) return;

        const cleanFixture = {
          ...editingFixture,
          week: editingFixture.week.trim().toUpperCase(),
          course: editingFixture.course.trim().toUpperCase(),
          dates: editingFixture.dates.trim().toUpperCase(),
          par: Number(editingFixture.par) || 72,
          bye: editingFixture.isFinal ? "" : (editingFixture.bye || ""),
          matchups: editingFixture.isFinal
            ? []
            : (editingFixture.matchups || []).filter((m) => m.p1 && m.p2)
        };

        try {
          if (dbStatus === "live" && window.FirebaseDB) {
            const { db, doc, setDoc } = window.FirebaseDB;
            const existsInList = fixtures.some((f) => f.id === cleanFixture.id);
            const nextList = existsInList
              ? fixtures.map((f) => (f.id === cleanFixture.id ? cleanFixture : f))
              : [...fixtures, cleanFixture];

            for (const item of nextList) {
              await setDoc(doc(db, "season3_fixtures", item.id), item, { merge: true });
            }
          } else {
            const existsInList = fixtures.some((f) => f.id === cleanFixture.id);
            const nextList = existsInList
              ? fixtures.map((f) => (f.id === cleanFixture.id ? cleanFixture : f))
              : [...fixtures, cleanFixture];
            nextList.sort((a, b) => (a.order || 50) - (b.order || 50));
            setFixtures(nextList);
            localStorage.setItem("cm_s3_fixtures", JSON.stringify(nextList));
          }

          setEditingFixture(null);
          showToast("Fixture schedule updated!");
        } catch (err) {
          console.error(err);
          showToast("Failed to save fixture.", "error");
        }
      };

      const handleDeleteFixture = async (fixtureId) => {
        try {
          if (dbStatus === "live" && window.FirebaseDB) {
            const { db, doc, setDoc, deleteDoc } = window.FirebaseDB;
            const remaining = fixtures.filter((f) => f.id !== fixtureId);
            for (const item of remaining) {
              await setDoc(doc(db, "season3_fixtures", item.id), item, { merge: true });
            }
            await deleteDoc(doc(db, "season3_fixtures", fixtureId));
          } else {
            const remaining = fixtures.filter((f) => f.id !== fixtureId);
            setFixtures(remaining);
            localStorage.setItem("cm_s3_fixtures", JSON.stringify(remaining));
          }
          setEditingFixture(null);
          showToast("Fixture removed.");
        } catch (err) {
          showToast("Could not delete fixture.", "error");
        }
      };

      // Compute Live Standings Table from Season 3 H2H Matches
      const standings = useMemo(() => {
        const statsMap = {};
        ROSTER.forEach((p) => {
          statsMap[p.id] = {
            ...p,
            played: 0,
            wins: 0,
            losses: 0,
            ties: 0,
            pts: 0,
            netDiffSum: 0,
            form: []
          };
        });

        matches.forEach((m) => {
          if (!m.playerB) return;
          const outcome = calculateMatchOutcome(m);

          const sA = statsMap[m.playerA];
          if (sA) {
            sA.played += 1;
            sA.pts += outcome.ptsA;
            sA.netDiffSum += outcome.netA - (Number(m.par) || 72);
            if (outcome.resultA === "W") sA.wins += 1;
            else if (outcome.resultA === "L") sA.losses += 1;
            else sA.ties += 1;
            sA.form.push(outcome.resultA);
          }

          const sB = statsMap[m.playerB];
          if (sB) {
            sB.played += 1;
            sB.pts += outcome.ptsB;
            sB.netDiffSum += outcome.netB - (Number(m.par) || 72);
            if (outcome.resultB === "W") sB.wins += 1;
            else if (outcome.resultB === "L") sB.losses += 1;
            else sB.ties += 1;
            sB.form.push(outcome.resultB);
          }
        });

        return Object.values(statsMap).sort((a, b) => {
          if (b.pts !== a.pts) return b.pts - a.pts;
          if (b.wins !== a.wins) return b.wins - a.wins;
          if (a.played !== b.played && (a.played === 0 || b.played === 0)) return b.played - a.played;
          return a.netDiffSum - b.netDiffSum;
        });
      }, [matches]);

      // Compute All-Time Records
      const dynamicRecords = useMemo(() => {
        const records = LEGACY_LEAGUE_RECORDS.map((r) => ({ ...r }));

        matches.forEach((m) => {
          if (!m.playerB) return;
          const out = calculateMatchOutcome(m);
          const gA = Number(m.grossA);
          const gB = Number(m.grossB);

          if (gA < parseInt(records[0].value, 10)) {
            records[0] = { ...records[0], value: `${gA} strokes`, holder: m.playerA, detail: `${m.courseName} (S3)` };
          }
          if (gB < parseInt(records[0].value, 10)) {
            records[0] = { ...records[0], value: `${gB} strokes`, holder: m.playerB, detail: `${m.courseName} (S3)` };
          }

          if (out.netA < parseInt(records[1].value, 10)) {
            records[1] = { ...records[1], value: `${out.netA} net`, holder: m.playerA, detail: `${m.courseName} (S3)` };
          }
          if (out.netB < parseInt(records[1].value, 10)) {
            records[1] = { ...records[1], value: `${out.netB} net`, holder: m.playerB, detail: `${m.courseName} (S3)` };
          }

          if (out.netA > parseInt(records[2].value, 10)) {
            records[2] = { ...records[2], value: `${out.netA} net`, holder: m.playerA, detail: `${m.courseName} (S3)` };
          }
          if (out.netB > parseInt(records[2].value, 10)) {
            records[2] = { ...records[2], value: `${out.netB} net`, holder: m.playerB, detail: `${m.courseName} (S3)` };
          }

          if (out.margin > parseInt(records[3].value, 10)) {
            const winName = out.netA < out.netB ? m.playerA : m.playerB;
            const loseName = out.netA < out.netB ? m.playerB : m.playerA;
            records[3] = { ...records[3], value: `${out.margin} strokes`, holder: winName, detail: `def. ${loseName} (S3)` };
          }
        });

        standings.forEach((s) => {
          if (s.played > parseInt(records[4].value, 10)) {
            records[4] = { ...records[4], value: `${s.played} matches`, holder: s.name, detail: "Season 3" };
          }
        });

        return records;
      }, [matches, standings]);

      const handleSelectFixture = (weekObj, p1, p2) => {
        setEditingId(null);
        setSelectedWeek(weekObj.week);
        setCourseName(weekObj.course);
        setCoursePar(weekObj.par);
        const r1 = ROSTER.find((r) => r.id === p1);
        const r2 = ROSTER.find((r) => r.id === p2);
        setPlayerA(p1);
        setHcpA(r1 ? r1.hcp : 0);
        setGrossA("");
        setPlayerB(p2 || "Bill");
        setHcpB(r2 ? r2.hcp : 6);
        setGrossB("");
        setTiebreaker("NONE");
        setActiveTab("scorecard");
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const handleWeekSelectChange = (wk) => {
        setSelectedWeek(wk);
        const found = fixtures.find((s) => s.week === wk);
        if (found) {
          setCourseName(found.course);
          setCoursePar(found.par);
        }
      };

      const handlePlayerAChange = (val) => {
        setPlayerA(val);
        const found = ROSTER.find((r) => r.id === val);
        if (found) setHcpA(found.hcp);
        if (val === playerB) {
          const alt = ROSTER.find((r) => r.id !== val);
          if (alt) {
            setPlayerB(alt.id);
            setHcpB(alt.hcp);
          }
        }
      };

      const handlePlayerBChange = (val) => {
        setPlayerB(val);
        const found = ROSTER.find((r) => r.id === val);
        if (found) setHcpB(found.hcp);
      };

      const handleEditMatch = (match) => {
        setEditingId(match.id);
        setSelectedWeek(match.week || "WEEK 1");
        setCourseName(match.courseName);
        setCoursePar(match.par || 72);
        setPlayerA(match.playerA);
        setHcpA(match.hcpA);
        setGrossA(String(match.grossA));
        setPlayerB(match.playerB || "Bill");
        setHcpB(match.hcpB ?? 6);
        setGrossB(match.grossB !== undefined && match.grossB !== null ? String(match.grossB) : "");
        setTiebreaker(match.tiebreaker || "NONE");
        setActiveTab("scorecard");
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const handleDeleteMatch = async (matchId) => {
        try {
          if (dbStatus === "live" && window.FirebaseDB) {
            const { db, doc, deleteDoc } = window.FirebaseDB;
            await deleteDoc(doc(db, "season3_matches", matchId));
          } else {
            const updated = matches.filter((m) => m.id !== matchId);
            setMatches(updated);
            localStorage.setItem("cm_s3_matches", JSON.stringify(updated));
          }
          setConfirmDeleteId(null);
          showToast("Match deleted and standings updated.");
        } catch (err) {
          console.error("Delete failed:", err);
          showToast("Could not delete match.", "error");
        }
      };

      const handleSubmitMatch = async (e) => {
        e.preventDefault();
        if (!playerA || !playerB || !grossA || !grossB) {
          showToast("Please select both golfers and enter both Gross scores.", "error");
          return;
        }
        if (playerB === playerA) {
          showToast("Player A and Player B cannot be the same golfer!", "error");
          return;
        }

        setSubmitting(true);
        const payload = {
          week: selectedWeek,
          courseName: courseName.trim().toUpperCase(),
          par: Number(coursePar) || 72,
          playerA,
          hcpA: Number(hcpA),
          grossA: Number(grossA),
          playerB,
          hcpB: Number(hcpB),
          grossB: Number(grossB),
          tiebreaker,
          updatedAtMs: Date.now()
        };

        try {
          if (dbStatus === "live" && window.FirebaseDB) {
            const { db, collection, addDoc, updateDoc, doc } = window.FirebaseDB;
            if (editingId) {
              await updateDoc(doc(db, "season3_matches", editingId), payload);
              showToast("Match updated in live database!");
            } else {
              await addDoc(collection(db, "season3_matches"), {
                ...payload,
                createdAtMs: Date.now()
              });
              showToast("Scorecard logged to Firebase!");
            }
          } else {
            if (editingId) {
              const updated = matches.map((m) => (m.id === editingId ? { ...m, ...payload } : m));
              setMatches(updated);
              localStorage.setItem("cm_s3_matches", JSON.stringify(updated));
              showToast("Match updated locally!");
            } else {
              const newDoc = {
                id: "local_" + Date.now(),
                ...payload,
                createdAtMs: Date.now()
              };
              const updated = [...matches, newDoc];
              setMatches(updated);
              localStorage.setItem("cm_s3_matches", JSON.stringify(updated));
              showToast("Scorecard saved locally!");
            }
          }

          setEditingId(null);
          setGrossA("");
          setGrossB("");
          setTiebreaker("NONE");
          setActiveTab("standings");
        } catch (err) {
          console.error("Save error:", err);
          showToast("Error saving scorecard.", "error");
        } finally {
          setSubmitting(false);
        }
      };

      const livePreview = useMemo(() => {
        if (!grossA || !grossB || !playerA || !playerB) return null;
        return calculateMatchOutcome({
          playerA,
          hcpA,
          grossA,
          playerB,
          hcpB,
          grossB,
          par: coursePar,
          tiebreaker
        });
      }, [playerA, hcpA, grossA, playerB, hcpB, grossB, coursePar, tiebreaker]);

      const isFixturePlayed = (weekLabel, p1, p2) => {
        return matches.find(
          (m) =>
            m.week === weekLabel &&
            ((m.playerA === p1 && m.playerB === p2) || (m.playerA === p2 && m.playerB === p1))
        );
      };

      return (
        <div className="max-w-3xl mx-auto px-3 sm:px-6 pt-5">
          {/* Toast Notification */}
          {toast && (
            <div
              className={`fixed bottom-5 right-5 z-50 px-4 py-3 border-2 border-[#1A2B3C] shadow-[4px_4px_0px_#1A2B3C] font-bold text-sm flex items-center gap-2 ${
                toast.type === "error" ? "bg-[#C85A32] text-[#FAF8F3]" : "bg-[#2E5A44] text-[#FAF8F3]"
              }`}
            >
              <span>{toast.type === "error" ? "!" : "✓"}</span>
              <span>{toast.msg}</span>
            </div>
          )}

          {/* Fullscreen Poster Lightbox Modal */}
          {posterZoomed && posterImage && (
            <div
              onClick={() => setPosterZoomed(false)}
              className="fixed inset-0 z-50 bg-[#1A2B3C]/90 p-4 flex items-center justify-center cursor-zoom-out"
            >
              <div className="relative max-w-2xl w-full max-h-[92vh] flex flex-col items-center">
                <img
                  src={posterImage}
                  alt="Season 3 Official Poster"
                  className="max-h-[85vh] w-auto border-4 border-[#FAF8F3] shadow-2xl"
                />
                <button
                  onClick={() => setPosterZoomed(false)}
                  className="mt-3 bg-[#C85A32] text-[#FAF8F3] font-bold text-xs uppercase px-4 py-2 border-2 border-[#FAF8F3]"
                >
                  CLOSE PREVIEW
                </button>
              </div>
            </div>
          )}

          {/* Fixture Add / Edit Modal */}
          {editingFixture && (
            <div className="fixed inset-0 z-50 bg-[#1A2B3C]/80 p-3 sm:p-6 flex items-center justify-center overflow-y-auto">
              <div className="swiss-box w-full max-w-lg p-4 sm:p-6 my-auto">
                <div className="flex items-center justify-between border-b-2 border-[#1A2B3C] pb-2.5 mb-4">
                  <h3 className="font-display text-lg uppercase text-[#1A2B3C]">
                    EDIT / ADD FIXTURE
                  </h3>
                  <button
                    onClick={() => setEditingFixture(null)}
                    className="font-mono-swiss font-bold text-sm px-2 py-0.5 border border-[#1A2B3C] bg-[#F5F2EB] cursor-pointer"
                  >
                    ✕
                  </button>
                </div>

                <form onSubmit={handleSaveFixture} className="space-y-3.5 text-sm">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[10px] font-mono-swiss font-bold uppercase mb-1">
                        ROUND / WEEK LABEL
                      </label>
                      <input
                        type="text"
                        required
                        value={editingFixture.week}
                        onChange={(e) => setEditingFixture({ ...editingFixture, week: e.target.value })}
                        placeholder="e.g. WEEK 8"
                        className="w-full bg-[#F5F2EB] border-2 border-[#1A2B3C] px-2.5 py-1.5 font-bold uppercase"
                      />
                    </div>
                    <div>
                      <label className="block text-[10px] font-mono-swiss font-bold uppercase mb-1">
                        DATE RANGE
                      </label>
                      <input
                        type="text"
                        required
                        value={editingFixture.dates}
                        onChange={(e) => setEditingFixture({ ...editingFixture, dates: e.target.value })}
                        placeholder="e.g. JAN 18 – JAN 22"
                        className="w-full bg-[#F5F2EB] border-2 border-[#1A2B3C] px-2.5 py-1.5 font-bold uppercase"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-12 gap-3">
                    <div className="col-span-6">
                      <label className="block text-[10px] font-mono-swiss font-bold uppercase mb-1">
                        COURSE NAME
                      </label>
                      <input
                        type="text"
                        required
                        value={editingFixture.course}
                        onChange={(e) => setEditingFixture({ ...editingFixture, course: e.target.value })}
                        className="w-full bg-[#F5F2EB] border-2 border-[#1A2B3C] px-2.5 py-1.5 font-bold uppercase"
                      />
                    </div>
                    <div className="col-span-2">
                      <label className="block text-[10px] font-mono-swiss font-bold uppercase mb-1">
                        PAR
                      </label>
                      <input
                        type="number"
                        required
                        value={editingFixture.par}
                        onChange={(e) => setEditingFixture({ ...editingFixture, par: e.target.value })}
                        className="w-full bg-[#F5F2EB] border-2 border-[#1A2B3C] px-2 py-1.5 font-mono-swiss font-bold"
                      />
                    </div>
                    <div className="col-span-4">
                      <label className="block text-[10px] font-mono-swiss font-bold uppercase mb-1">
                        ICON STYLE
                      </label>
                      <select
                        value={editingFixture.pictogram || "wolfcreek"}
                        onChange={(e) => setEditingFixture({ ...editingFixture, pictogram: e.target.value })}
                        className="w-full bg-[#F5F2EB] border-2 border-[#1A2B3C] px-2 py-1.5 font-bold text-xs"
                      >
                        <option value="wolfcreek">Canyon Mesas</option>
                        <option value="montvert">Alpine Peaks</option>
                        <option value="barnbougle">Dunes &amp; Wave</option>
                        <option value="pinecoast_week">Pine Coast</option>
                        <option value="royalisland">Tropical Island</option>
                        <option value="imperiallake">Lake &amp; Pines</option>
                        <option value="castlepine">Castle Pine</option>
                        <option value="pinecoast">Final Banner</option>
                      </select>
                    </div>
                  </div>

                  {!editingFixture.isFinal && (
                    <>
                      <div>
                        <label className="block text-[10px] font-mono-swiss font-bold uppercase mb-1">
                          BYE WEEK PLAYER
                        </label>
                        <select
                          value={editingFixture.bye || ""}
                          onChange={(e) => setEditingFixture({ ...editingFixture, bye: e.target.value })}
                          className="w-full bg-[#F5F2EB] border-2 border-[#1A2B3C] px-2.5 py-1.5 font-bold text-xs"
                        >
                          <option value="">None</option>
                          {ROSTER.map((r) => (
                            <option key={r.id} value={r.id}>{r.name}</option>
                          ))}
                        </select>
                      </div>

                      <div className="bg-[#F5F2EB] p-3 border-2 border-[#1A2B3C]">
                        <div className="flex items-center justify-between mb-2">
                          <span className="text-[10px] font-mono-swiss font-bold uppercase">
                            HEAD-TO-HEAD MATCHUPS
                          </span>
                          <button
                            type="button"
                            onClick={() =>
                              setEditingFixture({
                                ...editingFixture,
                                matchups: [...(editingFixture.matchups || []), { p1: "Easty", p2: "Bill" }]
                              })
                            }
                            className="bg-[#2E5A44] text-[#FAF8F3] text-[10px] font-bold px-2 py-0.5 border border-[#1A2B3C] cursor-pointer"
                          >
                            + ADD MATCHUP
                          </button>
                        </div>

                        <div className="space-y-2">
                          {(editingFixture.matchups || []).map((m, idx) => (
                            <div key={idx} className="flex items-center gap-2">
                              <select
                                value={m.p1}
                                onChange={(e) => {
                                  const copy = [...editingFixture.matchups];
                                  copy[idx] = { ...copy[idx], p1: e.target.value };
                                  setEditingFixture({ ...editingFixture, matchups: copy });
                                }}
                                className="flex-1 bg-[#FAF8F3] border border-[#1A2B3C] px-2 py-1 font-bold text-xs"
                              >
                                {ROSTER.map((r) => (
                                  <option key={r.id} value={r.id}>{r.name}</option>
                                ))}
                              </select>
                              <span className="font-mono-swiss text-xs font-bold">vs</span>
                              <select
                                value={m.p2}
                                onChange={(e) => {
                                  const copy = [...editingFixture.matchups];
                                  copy[idx] = { ...copy[idx], p2: e.target.value };
                                  setEditingFixture({ ...editingFixture, matchups: copy });
                                }}
                                className="flex-1 bg-[#FAF8F3] border border-[#1A2B3C] px-2 py-1 font-bold text-xs"
                              >
                                {ROSTER.map((r) => (
                                  <option key={r.id} value={r.id}>{r.name}</option>
                                ))}
                              </select>
                              <button
                                type="button"
                                onClick={() => {
                                  const copy = editingFixture.matchups.filter((_, i) => i !== idx);
                                  setEditingFixture({ ...editingFixture, matchups: copy });
                                }}
                                className="bg-[#C85A32] text-[#FAF8F3] text-xs font-bold px-2 py-1 border border-[#1A2B3C] cursor-pointer"
                              >
                                ✕
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>
                    </>
                  )}

                  <div className="flex items-center justify-between pt-2 gap-2">
                    {fixtures.some((f) => f.id === editingFixture.id) ? (
                      <button

                        <div className="md:col-span-5 flex items-center justify-between md:border-r-2 md:border-[#1A2B3C]/25 md:pr-3">
                          <div>
                            <div className="font-display text-lg text-[#2E5A44] leading-tight">
                              {wk.course}
                            </div>
                            <div className="text-[11px] font-mono-swiss text-[#4A6B82]">
                              PAR {wk.par} • {(wk.location || "Bravo").split("(")[0].trim()}
                            </div>
                          </div>
                          <CoursePictogram type={wk.pictogram} />
                        </div>

                        <div className="md:col-span-4 space-y-1.5">
                          {(wk.matchups || []).map((pair, idx) => {
                            const p1 = Array.isArray(pair) ? pair[0] : pair.p1;
                            const p2 = Array.isArray(pair) ? pair[1] : pair.p2;
                            const playedMatch = isFixturePlayed(wk.week, p1, p2);
                            return (
                              <button
                                key={idx}
                                onClick={() =>
                                  playedMatch
                                    ? handleEditMatch(playedMatch)
                                    : handleSelectFixture(wk, p1, p2)
                                }
                                className={`w-full flex items-center justify-between px-2.5 py-1.5 text-xs font-bold border border-[#1A2B3C] transition-colors cursor-pointer ${
                                  playedMatch
                                    ? "bg-[#2E5A44] text-[#FAF8F3]"
                                    : "bg-[#F5F2EB] hover:bg-[#D49B35] text-[#1A2B3C]"
                                }`}
                              >
                                <span className="w-16 text-left">{p1}</span>
                                <span className="font-mono-swiss text-[10px] opacity-80">
                                  {playedMatch ? "✓ DONE" : "vs"}
                                </span>
                                <span className="w-16 text-right">{p2}</span>
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                </div>

                {fixtures
                  .filter((w) => w.isFinal)
                  .map((fin) => (
                    <div
                      key={fin.id}
                      className="border-t-4 border-[#1A2B3C] bg-[#F5F2EB] p-4 text-center relative"
                    >
                      <button
                        onClick={() => setEditingFixture({ ...fin })}
                        className="absolute top-2 right-3 text-[10px] font-mono-swiss font-bold uppercase underline text-[#4A6B82] hover:text-[#1A2B3C] cursor-pointer"
                      >
                        EDIT FINAL
                      </button>
                      <div className="inline-block bg-[#1A2B3C] text-[#FAF8F3] font-display text-sm sm:text-base uppercase tracking-widest px-6 py-1.5 mb-2">
                        THE CHAMPIONSHIP FINAL
                      </div>
                      <div className="font-display text-2xl sm:text-4xl text-[#C85A32] uppercase tracking-tight">
                        {fin.dates}
                      </div>
                      <div className="font-bold text-xs font-mono-swiss uppercase text-[#1A2B3C] mt-1 mb-2">
                        {fin.course} — {(fin.location || "AWAITING MEMBERS' VOTE").toUpperCase()}
                      </div>
                      <CoursePictogram type="pinecoast" />
                    </div>
                  ))}
              </section>
            </div>
          )}

          {/* =================================================================
              TAB 3: HEAD-TO-HEAD SCORECARD ENTRY
          ================================================================== */}
          {activeTab === "scorecard" && (
            <section className="swiss-box p-4 sm:p-6">
              <div className="flex items-center justify-between border-b-2 border-[#1A2B3C] pb-3 mb-5">
                <div>
                  <h3 className="font-display text-xl sm:text-2xl uppercase text-[#1A2B3C]">
                    {editingId ? "EDIT MATCH SCORECARD" : "OFFICIAL SCORECARD"}
                  </h3>
                  <p className="text-xs text-[#4A6B82] font-semibold uppercase">
                    2 PTS MATCH WIN • 1 PT LOSING PLAYER IF BEATING HANDICAP (NET &lt; PAR)
                  </p>
                </div>
                {editingId && (
                  <button
                    type="button"
                    onClick={() => {
                      setEditingId(null);
                      setGrossA("");
                      setGrossB("");
                      setTiebreaker("NONE");
                    }}
                    className="swiss-btn bg-[#FAF8F3] text-xs font-bold uppercase px-3 py-1.5 cursor-pointer"
                  >
                    CANCEL EDIT
                  </button>
                )}
              </div>

              <form onSubmit={handleSubmitMatch} className="space-y-5">
                <div className="grid grid-cols-1 sm:grid-cols-12 gap-3 bg-[#F5F2EB] p-3.5 border-2 border-[#1A2B3C]">
                  <div className="sm:col-span-4">
                    <label className="block text-[11px] font-mono-swiss font-bold uppercase mb-1">
                      SCHEDULE WEEK
                    </label>
                    <select
                      value={selectedWeek}
                      onChange={(e) => handleWeekSelectChange(e.target.value)}
                      className="w-full bg-[#FAF8F3] border-2 border-[#1A2B3C] px-3 py-2 font-bold text-sm"
                    >
                      {fixtures.map((s) => (
                        <option key={s.id} value={s.week}>
                          {s.week} — {s.course}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div className="sm:col-span-5">
                    <label className="block text-[11px] font-mono-swiss font-bold uppercase mb-1">
                      BRAVO COURSE NAME
                    </label>
                    <input
                      type="text"
                      value={courseName}
                      onChange={(e) => setCourseName(e.target.value)}
                      required
                      className="w-full bg-[#FAF8F3] border-2 border-[#1A2B3C] px-3 py-2 font-bold text-sm uppercase"
                    />
                  </div>

                  <div className="sm:col-span-3">
                    <label className="block text-[11px] font-mono-swiss font-bold uppercase mb-1">
                      COURSE PAR
                    </label>
                    <input
                      type="number"
                      min="54"
                      max="76"
                      value={coursePar}
                      onChange={(e) => setCoursePar(e.target.value)}
                      required
                      className="w-full bg-[#FAF8F3] border-2 border-[#1A2B3C] px-3 py-2 font-mono-swiss font-bold text-sm"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="border-2 border-[#1A2B3C] bg-[#FAF8F3] p-4 shadow-[3px_3px_0px_#2E5A44]">
                    <div className="text-xs font-display uppercase text-[#2E5A44] mb-3">
                      PLAYER A
                    </div>
                    <div className="space-y-3">
                      <div>
                        <label className="block text-[11px] font-mono-swiss font-bold uppercase mb-1">
                          GOLFER
                        </label>
                        <select
                          value={playerA}
                          onChange={(e) => handlePlayerAChange(e.target.value)}
                          className="w-full bg-[#F5F2EB] border-2 border-[#1A2B3C] px-3 py-2 font-bold text-sm"
                        >
                          {ROSTER.map((r) => (
                            <option key={r.id} value={r.id}>
                              {r.name} (HCP {r.hcp})
                            </option>
                          ))}
                        </select>
                      </div>

                      <div className="grid grid-cols-2 gap-2.5">
                        <div>
                          <label className="block text-[11px] font-mono-swiss font-bold uppercase mb-1">
                            HCP
                          </label>
                          <input
                            type="number"
                            step="1"
                            value={hcpA}
                            onChange={(e) => setHcpA(e.target.value)}
                            required
                            className="w-full bg-[#F5F2EB] border-2 border-[#1A2B3C] px-3 py-2 font-mono-swiss font-bold text-base"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-mono-swiss font-bold uppercase mb-1">
                            GROSS SCORE
                          </label>
                          <input
                            type="number"
                            min="45"
                            max="150"
                            placeholder="e.g. 78"
                            value={grossA}
                            onChange={(e) => setGrossA(e.target.value)}
                            required
                            className="w-full bg-[#FAF8F3] border-2 border-[#1A2B3C] px-3 py-2 font-mono-swiss font-bold text-base focus:bg-[#D49B35]/20 outline-none"
                          />
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="border-2 border-[#1A2B3C] bg-[#FAF8F3] p-4 shadow-[3px_3px_0px_#C85A32]">
                    <div className="text-xs font-display uppercase text-[#C85A32] mb-3">
                      PLAYER B
                    </div>
                    <div className="space-y-3">
                      <div>
                        <label className="block text-[11px] font-mono-swiss font-bold uppercase mb-1">
                          OPPONENT
                        </label>
                        <select
                          value={playerB}
                          onChange={(e) => handlePlayerBChange(e.target.value)}
                          className="w-full bg-[#F5F2EB] border-2 border-[#1A2B3C] px-3 py-2 font-bold text-sm"
                        >
                          {ROSTER.filter((r) => r.id !== playerA).map((r) => (
                            <option key={r.id} value={r.id}>
                              {r.name} (HCP {r.hcp})
                            </option>
                          ))}
                        </select>
                      </div>

                      <div className="grid grid-cols-2 gap-2.5">
                        <div>
                          <label className="block text-[11px] font-mono-swiss font-bold uppercase mb-1">
                            HCP
                          </label>
                          <input
                            type="number"
                            step="1"
                            value={hcpB}
                            onChange={(e) => setHcpB(e.target.value)}
                            required
                            className="w-full bg-[#F5F2EB] border-2 border-[#1A2B3C] px-3 py-2 font-mono-swiss font-bold text-base"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-mono-swiss font-bold uppercase mb-1">
                            GROSS SCORE
                          </label>
                          <input
                            type="number"
                            min="45"
                            max="150"
                            placeholder="e.g. 76"
                            value={grossB}
                            onChange={(e) => setGrossB(e.target.value)}
                            required
                            className="w-full bg-[#FAF8F3] border-2 border-[#1A2B3C] px-3 py-2 font-mono-swiss font-bold text-base focus:bg-[#D49B35]/20 outline-none"
                          />
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="bg-[#F5F2EB] p-3 border-2 border-[#1A2B3C]">
                  <label className="block text-[11px] font-mono-swiss font-bold uppercase mb-1">
                    TIEBREAKER (IF NET SCORES ARE LEVEL)
                  </label>
                  <select
                    value={tiebreaker}
                    onChange={(e) => setTiebreaker(e.target.value)}
                    className="w-full bg-[#FAF8F3] border-2 border-[#1A2B3C] px-3 py-2 font-bold text-xs uppercase"
                  >
                    <option value="NONE">NO TIE / SPLIT POINTS IF LEVEL (1 PT EACH)</option>
                    <option value="A">{playerA.toUpperCase()} WINS SUDDEN-DEATH TIEBREAKER (2 PTS)</option>
                    <option value="B">{playerB.toUpperCase()} WINS SUDDEN-DEATH TIEBREAKER (2 PTS)</option>
                  </select>
                </div>

                {livePreview && (
                  <div className="bg-[#1A2B3C] text-[#FAF8F3] p-4 border-2 border-[#1A2B3C]">
                    <div className="text-[10px] font-mono-swiss uppercase text-[#D49B35] mb-2">
                      LIVE POINTS PREVIEW (PAR {coursePar})
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
                      <div className="flex items-center justify-between border border-[#FAF8F3]/25 px-3 py-2">
                        <div>
                          <span className="font-bold uppercase">{playerA}</span>
                          <div className="text-xs font-mono-swiss text-[#8DA18E]">
                            Net {livePreview.netA}{" "}
                            {livePreview.resultA === "W"
                              ? "(Match Win)"
                              : livePreview.loserBonusA
                              ? "(Loser HCP Bonus +1)"
                              : livePreview.resultA === "T"
                              ? "(Halved Match)"
                              : "(No Bonus)"}
                          </div>
                        </div>
                        <span className="font-display text-xl text-[#D49B35]">
                          +{livePreview.ptsA} PTS
                        </span>
                      </div>

                      <div className="flex items-center justify-between border border-[#FAF8F3]/25 px-3 py-2">
                        <div>
                          <span className="font-bold uppercase">{playerB}</span>
                          <div className="text-xs font-mono-swiss text-[#8DA18E]">
                            Net {livePreview.netB}{" "}
                            {livePreview.resultB === "W"
                              ? "(Match Win)"
                              : livePreview.loserBonusB
                              ? "(Loser HCP Bonus +1)"
                              : livePreview.resultB === "T"
                              ? "(Halved Match)"
                              : "(No Bonus)"}
                          </div>
                        </div>
                        <span className="font-display text-xl text-[#D49B35]">
                          +{livePreview.ptsB} PTS
                        </span>
                      </div>
                    </div>
                  </div>
                )}

                <button
                  type="submit"
                  disabled={submitting}
                  className="swiss-btn w-full bg-[#2E5A44] hover:bg-[#234635] text-[#FAF8F3] font-display text-lg uppercase py-3.5 tracking-wider cursor-pointer disabled:opacity-50"
                >
                  {submitting
                    ? "SAVING TO FIREBASE..."
                    : editingId
                    ? "UPDATE MATCH RESULT"
                    : "SUBMIT OFFICIAL SCORECARD"}
                </button>
              </form>
            </section>
          )}

          {/* =================================================================
              TAB 4: HALL OF FAME, ALL-TIME RECORDS & OFFICIAL RULES
          ================================================================== */}
          {activeTab === "records" && (
            <div className="space-y-6">
              <section className="swiss-box p-4 sm:p-5">
                <div className="border-b-2 border-[#1A2B3C] pb-3 mb-4">
                  <h3 className="font-display text-xl sm:text-2xl uppercase text-[#1A2B3C]">
                    YELLOW JACKET HALL OF FAME
                  </h3>
                  <p className="text-xs text-[#4A6B82] font-semibold uppercase">
                    CHAMPIONS OF THE CHUG MULLIGAN
                  </p>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  {HALL_OF_FAME_ENTRIES.map((champ) => (
                    <div
                      key={champ.id}
                      className="border-2 border-[#1A2B3C] bg-[#F5F2EB] p-4 shadow-[3px_3px_0px_#D49B35] flex flex-col items-center text-center"
                    >
                      <div className="inline-block bg-[#D49B35] text-[#1A2B3C] font-mono-swiss font-bold text-[10px] px-2 py-0.5 border border-[#1A2B3C] mb-3">
                        {champ.season}
                      </div>

                      <PhotoDropAvatar
                        photoUrl={hofPhotos[champ.id] || champ.defaultGif}
                        fallbackPhotoUrl={playerPhotos[champ.playerId]}
                        fallbackText={champ.champion.slice(0, 2)}
                        bgColor={champ.badgeColor}
                        textColor="#FAF8F3"
                        sizeClass="w-28 h-28"
                        onUpload={(file) => handleUploadHofPhoto(champ.id, file)}
                        hint={`Update ${champ.champion} Hall of Fame portrait`}
                      />

                      <div className="font-display text-2xl text-[#1A2B3C] uppercase mt-3">
                        {champ.champion}
                      </div>
                      <div className="text-[11px] font-bold uppercase text-[#2E5A44] mt-0.5">
                        {champ.subtitle}
                      </div>
                      <p className="text-xs text-[#1A2B3C]/80 mt-2 leading-relaxed">
                        {champ.notes}
                      </p>
                    </div>
                  ))}

                  <div className="border-2 border-dashed border-[#1A2B3C] bg-[#FAF8F3] p-4 flex flex-col items-center justify-center text-center">
                    <div className="inline-block bg-[#1A2B3C] text-[#FAF8F3] font-mono-swiss font-bold text-[10px] px-2 py-0.5 mb-3">
                      SEASON 3 (2027)
                    </div>
                    <div className="w-28 h-28 rounded-full border-2 border-dashed border-[#1A2B3C] flex items-center justify-center font-display text-3xl text-[#4A6B82]">
                      ?
                    </div>
                    <div className="font-display text-xl text-[#C85A32] uppercase mt-3">
                      TO BE DECIDED
                    </div>
                    <div className="text-[11px] font-mono-swiss uppercase text-[#4A6B82] mt-1">
                      JAN 23 • VENUE TBC
                    </div>
                  </div>
                </div>
              </section>

              <section className="swiss-box p-4 sm:p-5">
                <div className="border-b-2 border-[#1A2B3C] pb-3 mb-4">
                  <h3 className="font-display text-xl sm:text-2xl uppercase text-[#1A2B3C]">
                    ALL-TIME LEAGUE RECORDS
                  </h3>
                  <p className="text-xs text-[#4A6B82] font-semibold uppercase">
                    SEASONS 1–3 COMBINED • AUTOMATICALLY UPDATES WHEN BROKEN
                  </p>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {dynamicRecords.map((rec, idx) => (
                    <div
                      key={idx}
                      className="border-2 border-[#1A2B3C] bg-[#F5F2EB] p-3.5 flex flex-col justify-between"
                      style={{ borderLeftWidth: "8px", borderLeftColor: rec.accent }}
                    >
                      <div className="text-[10px] font-mono-swiss font-bold uppercase text-[#4A6B82]">
                        {rec.title}
                      </div>
                      <div className="font-display text-2xl text-[#1A2B3C] my-1">
                        {rec.value}
                      </div>
                      <div className="text-xs font-bold uppercase text-[#1A2B3C]">
                        {rec.holder}{" "}
                        <span className="font-normal text-[#4A6B82]">• {rec.detail}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </section>

              <section className="swiss-box p-4 sm:p-5">
                <div className="border-b-2 border-[#1A2B3C] pb-3 mb-4">
                  <h3 className="font-display text-xl uppercase text-[#1A2B3C]">
                    WORLD TOUR COURSE RECORDS
                  </h3>
                  <p className="text-xs text-[#4A6B82] font-semibold uppercase">
                    HISTORICAL LOW NET &amp; PURIST (GROSS) BENCHMARKS
                  </p>
                </div>

                <div className="divide-y-2 divide-[#1A2B3C]/20">
                  {LEGACY_COURSE_RECORDS.map((c, i) => (
                    <div key={i} className="py-3 flex flex-wrap items-center justify-between gap-2">
                      <div className="font-bold text-sm uppercase text-[#2E5A44]">
                        {c.course}
                      </div>
                      <div className="flex gap-4 text-xs font-mono-swiss">
                        <span>
                          LOW NET: <strong>{c.lowNet}</strong> ({c.lowNetHolder})
                        </span>
                        <span>
                          PURIST: <strong>{c.purist}</strong> ({c.puristHolder})
                        </span>
                      </div>
                    </div>
                  ))}
                </div>
              </section>

              <section className="swiss-box p-4 sm:p-5">
                <div className="border-b-2 border-[#1A2B3C] pb-3 mb-4">
                  <h3 className="font-display text-xl uppercase text-[#1A2B3C]">
                    OFFICIAL RULES &amp; REGULATIONS
                  </h3>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
                  <div className="border-2 border-[#1A2B3C] p-3.5 bg-[#FAF8F3]">
                    <div className="font-display text-sm uppercase text-[#C85A32] mb-1.5">
                      1. REGULAR SEASON SCORING
                    </div>
                    <ul className="space-y-1.5 text-xs leading-relaxed">
                      <li>• <strong>Match Win:</strong> 2 Points (Head-to-Head only)</li>
                      <li>• <strong>Losing Bonus:</strong> 1 Point for the losing player if they beat their handicap (Net &lt; Course Par)</li>
                      <li>• <strong>Ties:</strong> Sudden-death playoff hole if played; otherwise 1 Point each</li>
                    </ul>
                  </div>

                  <div className="border-2 border-[#1A2B3C] p-3.5 bg-[#FAF8F3]">
                    <div className="font-display text-sm uppercase text-[#2E5A44] mb-1.5">
                      2. GRAND FINALE (JAN 23)
                    </div>
                    <ul className="space-y-1.5 text-xs leading-relaxed">
                      <li>• <strong>Venue:</strong> TBC — Awaiting Members' Vote</li>
                      <li>• <strong>Points to Strokes:</strong> Regular season points convert directly into minus strokes in the Final (e.g., 6 pts = −6 shots)</li>
                      <li>• <strong>Champion:</strong> Lowest net score after handicap and point-bonus strokes wins the Yellow Jacket</li>
                    </ul>
                  </div>

                  <div className="border-2 border-[#1A2B3C] p-3.5 bg-[#FAF8F3] sm:col-span-2">
                    <div className="font-display text-sm uppercase text-[#4A6B82] mb-1.5">
                      3. BRAVO SIMULATOR IN-GAME SETTINGS
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 text-xs">
                      <div className="bg-[#F5F2EB] p-2 border border-[#1A2B3C]">
                        <strong>GIMME CIRCLE:</strong> 1.5 Yards
                      </div>
                      <div className="bg-[#F5F2EB] p-2 border border-[#1A2B3C]">
                        <strong>PUTTING:</strong> Auto-line only (no changing direction)
                      </div>
                      <div className="bg-[#F5F2EB] p-2 border border-[#1A2B3C]">
                        <strong>MULLIGANS:</strong> 3 per round, tee shots only (max 1 per hole)
                      </div>
                    </div>
                  </div>
                </div>
              </section>
            </div>
          )}

          {/* =================================================================
              TAB 5: ANIMATED PLAYER PROFILES & SCOUTING REPORTS
          ================================================================== */}
          {activeTab === "profiles" && (
            <section className="space-y-5">
              <div className="swiss-box p-4 sm:p-5 flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h3 className="font-display text-xl sm:text-2xl uppercase text-[#1A2B3C]">
                    SEASON 3 ATHLETE PROFILES
                  </h3>
                  <p className="text-xs text-[#4A6B82] font-semibold uppercase tracking-wider">
                    OFFICIAL BRAVO WORLD TOUR ROSTER • TAP EDIT BIO TO UPDATE ANY SCOUTING REPORT
                  </p>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                {ROSTER.map((player) => {
                  const rankIndex = standings.findIndex((s) => s.id === player.id);
                  const stats = rankIndex >= 0 ? standings[rankIndex] : null;
                  return (
                    <PlayerProfileCard
                      key={player.id}
                      player={player}
                      rank={rankIndex >= 0 ? rankIndex + 1 : "-"}
                      stats={stats}
                      staticPhoto={playerPhotos[player.id]}
                      bio={playerBios[player.id]}
                      onSaveBio={handleSavePlayerBio}
                    />
                  );
                })}
              </div>
            </section>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
